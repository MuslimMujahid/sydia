  <script>
    (() => {
      const D = 10.438;
      const tl = gsap.timeline({ paused: true });

      // Camera — static at the approved landed framing (no CSS transform on the element).
      tl.set(
        "#f06-cam",
        {
          x: -402,
          y: -18.5,
          scale: 1.55,
          transformOrigin: "0 0",
          immediateRender: true,
        },
        0
      );

      // ── Scene 1 (0.0–2.0s): working theater on the real status plates ──
      // The app's own loader icon spins (1 rev/s, like the app); dies when the answer lands.
      const SPIN_END = 2.34;
      tl.fromTo(
        "#f06-spin",
        { rotation: 0, transformOrigin: "50% 50%" },
        { rotation: 360 * SPIN_END, duration: SPIN_END, ease: "none" },
        0
      );
      // "menyiapkan jawaban…" → "menampilkan file…" on "detik"
      tl.fromTo(
        "#f06-show",
        { opacity: 0 },
        { opacity: 1, duration: 0.15, ease: "none" },
        0.98
      );

      // ── Scene 2 (2.09–3.3s): the answer lands, doc ring + "Ketemu" stamp ──
      tl.fromTo(
        "#f06-shot",
        { opacity: 0 },
        { opacity: 1, duration: 0.25, ease: "power1.out" },
        2.09
      );
      tl.fromTo(
        "#f06-hl-doc",
        { opacity: 0, scale: 0.9, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        2.48
      );
      tl.fromTo(
        "#f06-badge",
        { opacity: 0, scale: 0.6, transformOrigin: "50% 100%" },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        2.62
      );

      // ── Scene 3 (3.0–6.6s): document card, money underline, deposit count-up ──
      tl.fromTo(
        "#f06-c1",
        { opacity: 0, x: 80 },
        { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" },
        3.0
      );
      tl.fromTo(
        "#f06-ul-money",
        { scaleX: 0, transformOrigin: "0% 50%" },
        { scaleX: 1, duration: 0.55, ease: "power2.inOut" },
        3.92
      );
      tl.fromTo(
        "#f06-c2",
        { opacity: 0, y: 50 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        4.18
      );

      const COUNT_AT = 4.3;
      const COUNT_DUR = 2.0; // lands exactly at 6.30 ("rupiah")
      const COUNT_EASE_NAME = "power2.out";
      const countEase = gsap.parseEase(COUNT_EASE_NAME);
      tl.fromTo(
        "#f06-money",
        { scale: 0.6, transformOrigin: "0% 50%" },
        { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE_NAME },
        COUNT_AT
      );

      // ── Scene 4 (7.2–10.44s): source ring, source card, "halaman 1" glow ──
      tl.fromTo(
        "#f06-hl-src",
        { opacity: 0, scale: 0.9, transformOrigin: "50% 50%" },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        7.47
      );
      tl.fromTo(
        "#f06-c3",
        { opacity: 0, y: 50 },
        { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" },
        8.35
      );

      // One linear driver renders every time-derived text/glow state (seek-safe).
      const money = document.getElementById("f06-money");
      const page = document.getElementById("f06-page");
      const fmtRp = (n) =>
        "Rp " + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ".");

      const GLOW = { start: 8.7, end: 9.55 };
      const ATTACK = 0.2;
      const RELEASE = 0.5;
      const REST = 0.2;
      const MAX_BLUR = 32;
      const MAX_SCALE_BOOST = 0.15;
      const REST_RGB = { r: 107, g: 100, b: 112 };
      const PINK_RGB = { r: 239, g: 90, b: 138 };
      const lerp = (a, b, k) => Math.round(a + (b - a) * k);
      const envelope = (t, start, end) => {
        if (t < start) return 0;
        if (t < end) return Math.min((t - start) / ATTACK, 1);
        if (t < end + RELEASE) return 1 - ((t - end) / RELEASE) * (1 - REST);
        return REST;
      };

      let lastMoney = "";
      const render = (t) => {
        const p = Math.min(Math.max((t - COUNT_AT) / COUNT_DUR, 0), 1);
        const text = fmtRp(Math.round(13000 * countEase(p)) * 1000);
        if (text !== lastMoney) {
          money.textContent = text;
          lastMoney = text;
        }
        const env = envelope(t, GLOW.start, GLOW.end);
        page.style.color = `rgb(${lerp(REST_RGB.r, PINK_RGB.r, env)}, ${lerp(REST_RGB.g, PINK_RGB.g, env)}, ${lerp(REST_RGB.b, PINK_RGB.b, env)})`;
        page.style.textShadow = `0 0 ${(MAX_BLUR * env).toFixed(2)}px rgba(239, 90, 138, ${(0.85 * env).toFixed(3)})`;
        page.style.transform = `scale(${(1 + MAX_SCALE_BOOST * env).toFixed(4)})`;
      };

      const drv = { t: 0 };
      tl.fromTo(
        drv,
        { t: 0 },
        { t: D, duration: D, ease: "none", onUpdate: () => render(drv.t) },
        0
      );
      render(0);

      window.__timelines = window.__timelines || {};
      window.__timelines["06-found"] = tl;
    })();
  </script>
