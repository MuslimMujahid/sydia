        const el = document.getElementById(id);
        if (!el) return;
        const phase = { p: 0 };

          phase,
          {
            p: Math.PI * 2 * cycles,
            duration: period * cycles,
            ease: "none",
            onUpdate: function () {
              const s = Math.sin(phase.p);
              el.style.opacity = String(base + s * 0.02);
              el.style.transform = "scale(" + (1 + s * 0.012) + ")";
            },
          },
          at
        );
      };
