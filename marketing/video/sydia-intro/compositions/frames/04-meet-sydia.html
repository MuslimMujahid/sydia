  <script>
    (function () {
      const byId = (id) => document.getElementById(id);
      const tl = gsap.timeline({ paused: true });
      const END = 8.35;

      // ── Macro camera: slow pull-back under the whole shot, landing on the sketch (scale 1) at END.
      tl.fromTo(
        byId("f04-cam"),
        { scale: 1.045 },
        { scale: 1, duration: END, ease: "power1.out" },
        0
      );

      // ── Scene 1 (0.0–1.2s): ambient-glow-bloom — halos swell behind center, landing with the logo;
      //    then a bounded (1 - cos) breathe of whole cycles so each halo ends exactly at its peak.
      const BLOOMS = [
        {
          id: "f04-bloom-amber",
          peak: 0.45,
          at: 0.0,
          dur: 1.1,
          period: 3.6,
          oAmp: 0.05,
          sAmp: 0.02,
        },
        {
          id: "f04-bloom-violet",
          peak: 0.35,
          at: 0.1,
          dur: 1.15,
          period: 3.3,
          oAmp: 0.04,
          sAmp: 0.018,
        },
        {
          id: "f04-bloom-coral",
          peak: 0.18,
          at: 0.2,
          dur: 1.2,
          period: 2.9,
          oAmp: 0.03,
          sAmp: 0.015,
        },
      ];
      const BREATHS = 0; // breathing disabled (motion doctrine: no lazy breathing)
      BLOOMS.forEach((b) => {
        const el = byId(b.id);
        tl.fromTo(
          el,
          { opacity: 0, scale: 0.8 },
          { opacity: b.peak, scale: 1, duration: b.dur, ease: "power2.out" },
          b.at
        );
        const phase = { p: 0 };
        tl.fromTo(
          phase,
          { p: 0 },
          {
            p: Math.PI * 2 * BREATHS,
            duration: BREATHS * b.period,
            ease: "none",
            immediateRender: false,
            onUpdate: () => {
              const e = (1 - Math.cos(phase.p)) / 2;
              gsap.set(el, {
                opacity: b.peak - e * b.oAmp,
                scale: 1 + e * b.sAmp,
              });
            },
          },
          b.at + b.dur
        );
      });

      // Hub mark lands on "Kenalin" (0.30): scale 0.6→1, rotation -8°→0, blur 6px→0 — smooth, no overshoot.
      tl.fromTo(
        byId("f04-logo"),
        { opacity: 0, scale: 0.6, rotation: -8, filter: "blur(6px)" },
        {
          opacity: 1,
          scale: 1,
          rotation: 0,
          filter: "blur(0px)",
          duration: 0.9,
          ease: "power3.out",
        },
        0.3
      );

      // ── Scene 2 (1.24–2.8s): wordmark rises letter-by-letter on "Sydia".
      const WORD_AT = 1.24;
      const LETTER_STAGGER = 0.04;
      byId("f04-word")
        .querySelectorAll(".f04-ch")
        .forEach((ch, i) => {
          tl.fromTo(
            ch,
            { y: 40, opacity: 0 },
            { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" },
            WORD_AT + i * LETTER_STAGGER
          );
        });

      // ── Scene 3 (3.3–6.7s): constellation — each chip flies in from beyond its outer side to its ring slot
      //    as the VO names it; its dashed connector then draws from the chip into the hub (svg-path-draw).
      //    Dashed draw: a long dash list (6 on / 10 off) followed by one big gap, so strokeDashoffset both
      //    hides/reveals the line from the chip end AND later flows the dashes toward the hub.
      const PERIOD = 16;
      const FLOW = 96; // flow distance (whole periods) reserved for Scene 4
      const NODES = [
        { chip: "f04-n1", line: "f04-l1", side: -1, cue: 3.33, draw: 0.55 },
        { chip: "f04-n2", line: "f04-l2", side: -1, cue: 4.05, draw: 0.55 },
        { chip: "f04-n4", line: "f04-l4", side: 1, cue: 5.04, draw: 0.55 },
        { chip: "f04-n3", line: "f04-l3", side: -1, cue: 6.27, draw: 0.55 },
        { chip: "f04-n5", line: "f04-l5", side: 1, cue: 6.6, draw: 0.45 },
        { chip: "f04-n6", line: "f04-l6", side: 1, cue: 6.65, draw: 0.45 },
      ];
      const FLY_LEAD = 0.15;
      const FLY_DUR = 0.6;
      const FLY_DIST = 560;
      const DRAW_AFTER_CUE = 0.12;

      NODES.forEach((n) => {
        const chip = byId(n.chip);
        const line = byId(n.line);
        const flyAt = n.cue - FLY_LEAD;

        tl.fromTo(
          chip,
          { opacity: 0 },
          { opacity: 1, duration: 0.2, ease: "power1.out" },
          flyAt
        );
        tl.fromTo(
          chip,
          { x: n.side * FLY_DIST, rotation: n.side * -7 },
          { x: 0, rotation: 0, duration: FLY_DUR, ease: "power3.out" },
          flyAt
        );
        tl.fromTo(
          chip,
          { scale: 0.8 },
          { scale: 1, duration: FLY_DUR, ease: "power3.out" },
          flyAt
        );

        const x1 = Number(line.getAttribute("x1"));
        const y1 = Number(line.getAttribute("y1"));
        const x2 = Number(line.getAttribute("x2"));
        const y2 = Number(line.getAttribute("y2"));
        const len = Math.hypot(x2 - x1, y2 - y1);
        const k = Math.ceil((len + FLOW + PERIOD) / PERIOD);
        const dashes = [];
        for (let j = 0; j < k; j++) dashes.push(6, 10);
        dashes[dashes.length - 1] = 10 + len + PERIOD * 2;
        line.style.strokeDasharray = dashes.join(" ");
        const HIDDEN = k * PERIOD;

        tl.fromTo(
          line,
          { strokeDashoffset: HIDDEN },
          { strokeDashoffset: FLOW, duration: n.draw, ease: "power2.out" },
          n.cue + DRAW_AFTER_CUE
        );
      });

      // ── Scene 4 (7.0–8.35s): tagline word-by-word on "jadi satu" (7.04–7.30).
      const TAG_START = 7.04;
      const TAG_END = 7.3;
      const words = byId("f04-tag").querySelectorAll(".f04-w");
      const wordStep = (TAG_END - TAG_START) / (words.length - 1);
      words.forEach((w, i) => {
        tl.fromTo(
          w,
          { y: 24, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" },
          TAG_START + i * wordStep
        );
      });

      // Connector dashes flow once toward the hub (finite, 1.0s), landing on the sketch's dash phase; then hold.
      const FLOW_AT = 7.25;
      NODES.forEach((n) => {
        tl.fromTo(
          byId(n.line),
          { strokeDashoffset: FLOW },
          {
            strokeDashoffset: 0,
            duration: 1.0,
            ease: "sine.inOut",
            immediateRender: false,
          },
          FLOW_AT
        );
      });

      window.__timelines = window.__timelines || {};
      window.__timelines["04-meet-sydia"] = tl;
    })();
  </script>
