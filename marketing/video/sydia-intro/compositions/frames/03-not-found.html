  <script>
    (function () {
      const tl = gsap.timeline({ paused: true });
      const INK = "#171419";
      const LIGHT = "#9a939e";

      const queryEl = document.getElementById("f03-query");
      const caretEl = document.getElementById("f03-caret");
      const crumbA = document.getElementById("f03-crumb-a");
      const crumbB = document.getElementById("f03-crumb-b");
      const emptyEl = document.getElementById("f03-empty");

      // discrete-text-sequence — the query types in from an empty span (pause at the word break).
      const QUERY = [
        { t: 0.0, text: "" },
        { t: 0.7, text: "k" },
        { t: 0.78, text: "ko" },
        { t: 0.85, text: "kon" },
        { t: 0.93, text: "kont" },
        { t: 1.0, text: "kontr" },
        { t: 1.08, text: "kontra" },
        { t: 1.17, text: "kontrak" },
        { t: 1.27, text: "kontrak " },
        { t: 1.47, text: "kontrak s" },
        { t: 1.57, text: "kontrak se" },
        { t: 1.68, text: "kontrak sew" },
        { t: 1.82, text: "kontrak sewa" },
      ];
      // discrete-text-sequence — breadcrumb's last token hard-cuts in place on "folder".
      const CRUMB_SWAP_T = 3.92;

      function queryAt(time) {
        for (let i = QUERY.length - 1; i >= 0; i--) {
          if (time >= QUERY[i].t) return QUERY[i].text;
        }
        return "";
      }

      function renderText(time) {
        if (!queryEl || !caretEl || !crumbA || !crumbB) return;
        const q = queryAt(time);
        if (queryEl.textContent !== q) queryEl.textContent = q;
        // Caret: solid while typing, then a deterministic 0.8s blink.
        const typing = time >= 0.62 && time < 2.05;
        const on = typing || (time * 1.25) % 1 < 0.55;
        caretEl.style.opacity = on ? "1" : "0";
        const swapped = time >= CRUMB_SWAP_T;
        crumbA.style.display = swapped ? "none" : "";
        crumbB.style.display = swapped ? "" : "none";
      }

      const driver = { t: 0 };
      tl.fromTo(
        driver,
        { t: 0 },
        {
          t: 8.35,
          duration: 8.35,
          ease: "none",
          onUpdate: () => renderText(driver.t),
        },
        0
      );

      // Scene 1 (0.0–2.6s) — explorer card rises in; folder tiles pop staggered.
      tl.fromTo(
        "#f03-explorer",
        { y: 50, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.8, ease: "power3.out" },
        0.2
      );
      tl.fromTo(
        "#f03-grid .f03-folder",
        { y: 14, scale: 0.86, opacity: 0 },
        {
          y: 0,
          scale: 1,
          opacity: 1,
          duration: 0.45,
          ease: "power3.out",
          stagger: 0.06,
        },
        0.4
      );

      // Scene 2 (2.6–4.5s) — "Scroll." slams on "Scroll"; the grid does one quick upward flick.
      tl.fromTo(
        "#f03-w1",
        { x: 60, opacity: 0, filter: "blur(14px)" },
        {
          x: 0,
          opacity: 1,
          filter: "blur(0px)",
          duration: 0.4,
          ease: "expo.out",
        },
        2.77
      );
      tl.fromTo(
        "#f03-grid",
        { y: 0, filter: "blur(0px)" },
        { y: -24, filter: "blur(3px)", duration: 0.13, ease: "power2.out" },
        2.77
      );
      tl.fromTo(
        "#f03-grid",
        { y: -24, filter: "blur(3px)" },
        {
          y: 0,
          filter: "blur(0px)",
          duration: 0.22,
          ease: "power2.inOut",
          immediateRender: false,
        },
        2.9
      );

      // "Buka folder." slams on "buka"; the previous word dims so the newest is always ink.
      tl.fromTo(
        "#f03-w2",
        { x: 60, opacity: 0, filter: "blur(14px)" },
        {
          x: 0,
          opacity: 1,
          filter: "blur(0px)",
          duration: 0.4,
          ease: "expo.out",
        },
        3.58
      );
      tl.fromTo(
        "#f03-w1",
        { color: INK },
        { color: LIGHT, duration: 0.35, ease: "power2.out" },
        3.58
      );

      // On "folder" the breadcrumb token swaps (driver above) and the grid blinks as the folder opens.
      tl.fromTo(
        "#f03-grid",
        { opacity: 1 },
        { opacity: 0.15, duration: 0.06, ease: "none" },
        CRUMB_SWAP_T
      );
      tl.fromTo(
        "#f03-grid",
        { opacity: 0.15 },
        {
          opacity: 1,
          duration: 0.3,
          ease: "power2.out",
          immediateRender: false,
        },
        CRUMB_SWAP_T + 0.06
      );

      // Scene 3 (4.5–5.8s) — "Cari lagi." slams on "cari"; "Buka folder." dims.
      tl.fromTo(
        "#f03-w3",
        { x: 60, opacity: 0, filter: "blur(14px)" },
        {
          x: 0,
          opacity: 1,
          filter: "blur(0px)",
          duration: 0.4,
          ease: "expo.out",
        },
        4.61
      );
      tl.fromTo(
        "#f03-w2",
        { color: INK },
        { color: LIGHT, duration: 0.35, ease: "power2.out" },
        4.61
      );

      // The "0 hasil" row comes back empty, then shakes once on "nggak" (x ±8, 3 cycles, 0.3s).
      tl.fromTo(
        "#f03-empty",
        { y: 12, opacity: 0 },
        { y: 0, opacity: 1, duration: 0.3, ease: "power3.out" },
        5.3
      );
      const shake = { p: 0 };
      tl.fromTo(
        shake,
        { p: 0 },
        {
          p: 1,
          duration: 0.3,
          ease: "none",
          onUpdate: () => {
            const x = shake.p >= 1 ? 0 : Math.sin(shake.p * Math.PI * 6) * 8;
            if (emptyEl) gsap.set(emptyEl, { x: x });
          },
        },
        5.59
      );

      // Scene 4 (5.84–8.35s) — the stamp slams on "ketemu", the bloom behind it warms; then hold still.
      tl.fromTo(
        "#f03-stamp",
        { scale: 1.6, rotation: -14, opacity: 0 },
        { scale: 1, rotation: -6, opacity: 1, duration: 0.3, ease: "expo.out" },
        5.84
      );
      tl.fromTo(
        "#f03-bloom",
        { opacity: 0.06 },
        { opacity: 0.18, duration: 1.1, ease: "power2.out" },
        5.84
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["03-not-found"] = tl;
    })();
  </script>
