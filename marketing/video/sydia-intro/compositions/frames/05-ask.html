  <script>
    (() => {
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const DUR = 8.35;

      // Typed query: [time, chars visible]. Each word lands as the VO speaks it;
      // "mana ya?" completes at 6.40, "Uang jaminannya berapa?" by 6.90.
      const QUERY =
        "Dokumen sewa apartemen aku yang tahun lalu mana ya? Uang jaminannya berapa?";
      const KEYS = [
        [3.5, 0],
        [4.02, 8],
        [4.42, 13],
        [4.9, 23],
        [5.2, 27],
        [5.4, 32],
        [5.68, 38],
        [6.02, 43],
        [6.27, 48],
        [6.4, 51],
        [6.9, QUERY.length],
      ];
      const CARET_ON = 3.25;
      const BLINK_FROM = 6.95;
      const BLINK_HALF = 0.53;

      const typedEl = document.getElementById("f05-typed");
      const caretEl = document.getElementById("f05-caret");
      const patchEl = document.getElementById("f05-patch");

      function charsAt(t) {
        if (t <= KEYS[0][0]) return 0;
        for (let i = 1; i < KEYS.length; i++) {
          if (t < KEYS[i][0]) {
            const t0 = KEYS[i - 1][0];
            const c0 = KEYS[i - 1][1];
            const t1 = KEYS[i][0];
            const c1 = KEYS[i][1];
            return Math.floor(c0 + ((c1 - c0) * (t - t0)) / (t1 - t0));
          }
        }
        return QUERY.length;
      }

      function caretAt(t) {
        if (t < CARET_ON) return 0;
        if (t < BLINK_FROM) return 1;
        return Math.floor((t - BLINK_FROM) / BLINK_HALF) % 2 === 0 ? 1 : 0;
      }

      // Pure function of time: text slice, caret, placeholder cover.
      function paint(t) {
        const n = charsAt(t);
        typedEl.textContent = QUERY.slice(0, n);
        caretEl.style.opacity = String(caretAt(t));
        patchEl.style.opacity = n > 0 ? "1" : "0";
      }
      paint(0);

      // Scene 1: window rises into place; pill pops on "tanya".
      tl.fromTo(
        "#f05-win",
        { y: 70, opacity: 0 },
        { y: 0, opacity: 1, duration: 1.1, ease: "power3.out" },
        0
      );
      tl.fromTo(
        "#f05-pill",
        { opacity: 0, scale: 0.6 },
        { opacity: 1, scale: 1, duration: 0.5, ease: "power3.out" },
        0.64
      );
      tl.fromTo(
        "#f05-bloom-coral",
        { x: 0, y: 0 },
        { x: 60, y: -20, duration: DUR, ease: "sine.inOut" },
        0
      );
      tl.fromTo(
        "#f05-bloom-violet",
        { x: 0, y: 0 },
        { x: -60, y: 24, duration: DUR, ease: "sine.inOut" },
        0
      );

      // Scene 2: coordinate-target zoom onto the composer, landing on the approved framing.
      tl.fromTo(
        "#f05-cam",
        { x: 0, y: 0, scale: 1, transformOrigin: "0 0" },
        {
          x: -855,
          y: -346,
          scale: 1.9,
          transformOrigin: "0 0",
          duration: 1.2,
          ease: "power3.inOut",
          force3D: false,
        },
        2.09
      );

      // Scene 3: typing driver (time proxy, seek-safe).
      const drv = { t: 0 };
      tl.to(
        drv,
        { t: DUR, duration: DUR, ease: "none", onUpdate: () => paint(drv.t) },
        0
      );

      // Scene 4: send turns active with a pulse, pressed on the 7.30 beat with a ripple.
      tl.fromTo(
        "#f05-send",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" },
        6.9
      );
      tl.fromTo(
        "#f05-halo",
        { opacity: 0, scale: 1 },
        { opacity: 0.55, scale: 1.1, duration: 0.08, ease: "none" },
        6.95
      );
      tl.to(
        "#f05-halo",
        { opacity: 0, scale: 1.5, duration: 0.5, ease: "power2.out" },
        7.03
      );
      tl.to(
        "#f05-send",
        { scale: 0.86, duration: 0.09, ease: "power2.out" },
        7.3
      );
      tl.to("#f05-send", { scale: 1, duration: 0.4, ease: "power3.out" }, 7.39);
      tl.fromTo(
        "#f05-ripple",
        { opacity: 0, scale: 1 },
        { opacity: 0.65, scale: 1.12, duration: 0.06, ease: "none" },
        7.3
      );
      tl.to(
        "#f05-ripple",
        { opacity: 0, scale: 1.9, duration: 0.6, ease: "power2.out" },
        7.36
      );

      window.__timelines["05-ask"] = tl;
    })();
  </script>
