  <script>
    (function () {
      // One local beat grid drives every hit: downbeats 0.00 · 2.09, beats 0.52 · 1.04 · 1.57.
      const BEATS = [0.0, 0.52, 1.04, 1.57, 2.09];
      const DROP = BEATS[0];
      const SLAM_2 = BEATS[1];
      const SWEEP = BEATS[4];

      const tl = gsap.timeline({ paused: true });

      // Scene 1 (0.00) — the four ghost chips blow outward from the center cluster to their
      // edge slots, streaking along their travel axis, and settle blurred at 0.35.
      const GHOSTS = [
        {
          sel: "#f02-g1",
          blur: "f02-streak-blur-1",
          dx: -740,
          dy: -440,
          rot: -8,
        },
        {
          sel: "#f02-g2",
          blur: "f02-streak-blur-2",
          dx: 690,
          dy: -410,
          rot: 6,
        },
        {
          sel: "#f02-g3",
          blur: "f02-streak-blur-3",
          dx: -785,
          dy: 260,
          rot: 5,
        },
        {
          sel: "#f02-g4",
          blur: "f02-streak-blur-4",
          dx: 628,
          dy: 280,
          rot: -6,
        },
      ];
      const PEAK_BLUR = 12;
      const MOVE_DUR = 0.35;
      const PULL = 0.85; // start 85% of the way back toward frame center

      const streak = { v: PEAK_BLUR };
      const streakNodes = GHOSTS.map(function (g) {
        const len = Math.hypot(g.dx, g.dy);
        return {
          node: document.getElementById(g.blur),
          ux: Math.abs(g.dx) / len,
          uy: Math.abs(g.dy) / len,
        };
      });
      const writeStreak = function () {
        streakNodes.forEach(function (s) {
          if (!s.node) return;
          s.node.setAttribute(
            "stdDeviation",
            (streak.v * s.ux).toFixed(3) + " " + (streak.v * s.uy).toFixed(3)
          );
        });
      };
      writeStreak(); // seed t=0 with the streaked start

      GHOSTS.forEach(function (g) {
        tl.fromTo(
          g.sel,
          {
            x: -g.dx * PULL,
            y: -g.dy * PULL,
            rotation: 0,
            scale: 0.7,
            opacity: 0.9,
          },
          {
            x: 0,
            y: 0,
            rotation: g.rot,
            scale: 1,
            opacity: 0.35,
            duration: MOVE_DUR,
            ease: "expo.out",
          },
          DROP
        );
      });
      tl.fromTo(
        streak,
        { v: PEAK_BLUR },
        { v: 0, duration: MOVE_DUR, ease: "expo.out", onUpdate: writeStreak },
        DROP
      );

      // Scene 1 (0.05) — "Your Life is" slams in: scale + blur.
      tl.fromTo(
        "#f02-l1",
        { scale: 1.35, filter: "blur(8px)", opacity: 0 },
        {
          scale: 1,
          filter: "blur(0px)",
          opacity: 1,
          duration: 0.4,
          ease: "expo.out",
        },
        DROP + 0.05
      );

      // Scene 2 (0.52) — "Everywhere" slams in on the next beat: bigger scale + rise + blur.
      tl.fromTo(
        "#f02-l2",
        { scale: 1.5, y: 30, filter: "blur(10px)", opacity: 0 },
        {
          scale: 1,
          y: 0,
          filter: "blur(0px)",
          opacity: 1,
          duration: 0.45,
          ease: "expo.out",
        },
        SLAM_2
      );

      // Scene 2 — the blooms swell behind it (scale 0.8 → 1.1, opacity +0.15 up to the sketch value).
      [
        ["#f02-bloom-a", 0.45],
        ["#f02-bloom-c", 0.4],
        ["#f02-bloom-v", 0.38],
      ].forEach(function (b) {
        tl.fromTo(
          b[0],
          { scale: 0.8, opacity: b[1] - 0.15 },
          { scale: 1.1, opacity: b[1], duration: 1.4, ease: "power2.out" },
          SLAM_2
        );
      });

      // Scene 3 (2.09) — the aurora sweeps once through "Everywhere", then holds still.
      tl.fromTo(
        "#f02-l2",
        { backgroundPosition: "0% 50%" },
        { backgroundPosition: "100% 50%", duration: 1.2, ease: "power2.inOut" },
        SWEEP
      );

      window.__timelines = window.__timelines || {};
      window.__timelines["02-headline"] = tl;
    })();
