      const WIN_Y = 130;
      function cam(cx, cy, S) {
        let x = 616 - S * cx * K;
        let y = 385 - S * cy * K;
        x = Math.min(0, Math.max(1232 - 1232 * S, x));
        y = Math.min(0, Math.max(770 - 770 * S, y));
        return { x: x, y: y, scale: S, transformOrigin: "0 0", force3D: false };
      }
      // ring around an app-CSS box, drawn inside the cam at camera scale S
      function ring(id, b, pad, S, radius) {
        const el = document.getElementById(id);
        el.style.left = (b.x - pad) * K + "px";
        el.style.top = (b.y - pad) * K + "px";
        el.style.width = (b.w + pad * 2) * K + "px";
        el.style.height = (b.h + pad * 2) * K + "px";
        el.style.borderWidth = 2.5 / S + "px";
        el.style.borderRadius =
          radius === "pill" ? "9999px" : radius / S + "px";
        el.style.boxShadow = "0 0 0 " + 6 / S + "px rgba(239, 90, 138, 0.16)";
      }
      // cursor dot + ripple centered on an app-CSS point at camera scale S
      function dot(dotId, ripId, px, py, S) {
        const d = 22 / S;
        [dotId, ripId].forEach((id) => {
          const el = document.getElementById(id);
          el.style.left = px * K - d / 2 + "px";
          el.style.top = py * K - d / 2 + "px";
          el.style.width = d + "px";
          el.style.height = d + "px";
          el.style.borderWidth = (id === dotId ? 1.5 : 2.5) / S + "px";
        });
        document.getElementById(dotId).style.boxShadow =
          "0 " + 3 / S + "px " + 10 / S + "px rgba(23, 20, 25, 0.25)";
      }

      // Camera stops (app CSS centers)
      const C2a = cam(780, 352, 1.35); // sent bubble + "mencari dokumen…"
      const C2b = cam(740, 420, 1.7); // answer + Sumber list
      const C4a = cam(850, 650, 1.5); // second bubble + "membaca dokumen…"
      const C4b = cam(800, 430, 1.75); // summary title + paragraph
      const C4c = cam(800, 600, 1.75); // "Arah desain" + note line
      const C5a = cam(720, 450, 1.0); // conversation + note drawer
      const C5b = cam(1150, 200, 1.5); // drawer header (clamps top-right)
      const C6a = cam(480, 290, 1.8); // Notes: daily notes / folders panel
      const C6b = cam(990, 430, 1.8); // the open note
      const C7a = cam(856, 380, 1.3); // File list top
      const C7b = cam(856, 554, 1.3); // File list, Aurora row (clamps bottom)

      const T1 = "Sydia, cari dokumen tentang Proyek Aurora.";
      const T2 =
        "Sydia, rangkum kebutuhan utama dari brief proyek Aurora, lalu buatkan catatan baru berjudul Rangkuman Proyek Aurora berisi poin-poin pentingnya.";

      const t2El = document.getElementById("p05-t2");
      const c1El = document.getElementById("p05-c1");
      const c2El = document.getElementById("p05-c2");
      function chars(t, a, b, len) {
        if (t <= a) return 0;
        if (t >= b) return len;
        return Math.floor((len * (t - a)) / (b - a));
      }
      function caret(t, a, b) {
        if (t >= a && t <= b) return 1;
        return Math.floor(t / 0.53) % 2 === 0 ? 1 : 0;
      }
      function paint(t) {
        t1El.textContent = T1.slice(0, chars(t, 0.2, 1.6, T1.length));

      }
