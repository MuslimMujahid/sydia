    (() => {
      window.__timelines = window.__timelines || {};
      const DUR = 16.7;
      const tl = gsap.timeline({ paused: true });

      // ── Seek-safe typing: text and caret are pure functions of timeline time ──
      const QUERY =
        "Sydia, apa preferensi desain Nadia yang pernah kita bahas?";
      const TYPE_START = 0.3;
      const TYPE_END = 1.9;
      const BLINK_HALF = 0.4;
      const typedEl = document.getElementById("p04-typed");
      const caretEl = document.getElementById("p04-caret");
      const charsAt = (t) => {
        if (t <= TYPE_START) return 0;
        if (t >= TYPE_END) return QUERY.length;
        return Math.floor(
          (QUERY.length * (t - TYPE_START)) / (TYPE_END - TYPE_START)
        );
      };
      const caretAt = (t) => {
        if (t < TYPE_END) return 1;
        return Math.floor((t - TYPE_END) / BLINK_HALF) % 2 === 0 ? 1 : 0;
      };
      let lastN = -1;
      const paint = (t) => {
        const n = charsAt(t);
        if (n !== lastN) {
          typedEl.textContent = QUERY.slice(0, n);
          lastN = n;
        }
        caretEl.style.opacity = String(caretAt(t));
      };
      paint(0);
      const drv = { t: 0 };
      tl.fromTo(
        drv,
        { t: 0 },
        { t: DUR, duration: DUR, ease: "none", onUpdate: () => paint(drv.t) },
        0
      );

      // Ambient bloom drift (one slow pass, no loop).
      tl.fromTo(
        "#p04-bloom-coral",
        { x: 0, y: 0 },
        { x: 70, y: -24, duration: DUR, ease: "sine.inOut" },
        0
      );
      tl.fromTo(
        "#p04-bloom-violet",
        { x: 0, y: 0 },
        { x: -60, y: 26, duration: DUR, ease: "sine.inOut" },
        0
      );
      tl.fromTo(
        "#p04-bloom-amber",
        { x: 0, y: 0 },
        { x: -40, y: -20, duration: DUR, ease: "sine.inOut" },
        0
      );

      // Initial states for later layers.
      tl.set(
        "#p04-cam",
        { x: 0, y: 0, scale: 1, transformOrigin: "0 0", force3D: false },
        0
      );
      tl.set(["#p04-run", "#p04-answer", "#p04-patch"], { opacity: 0 }, 0);
      tl.set(
        ["#p04-mark1", "#p04-mark2", "#p04-mark3"],
        { scaleX: 0, transformOrigin: "0% 50%" },
        0
      );
      tl.set(["#p04-halo", "#p04-dot"], { opacity: 0 }, 0);

      // ── Scene 1 (0.0–2.1): new chat in place; big composer types; send press on 2.09 ──
      tl.fromTo(
        "#p04-composer",
        { opacity: 0, y: 24 },
        { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" },
        0
      );
      tl.fromTo(
        "#p04-halo",
        { opacity: 0, scale: 0.9 },
        { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out" },
        1.85
      );
      tl.to(
        "#p04-send",
        { scale: 0.9, duration: 0.08, ease: "power2.out" },
        2.09
      );
      tl.to("#p04-send", { scale: 1, duration: 0.3, ease: "power3.out" }, 2.17);
      tl.fromTo(
        "#p04-dot",
        { opacity: 0.9, scale: 0.4 },
        { opacity: 0, scale: 2.4, duration: 0.45, ease: "power2.out" },
        2.09
      );
      tl.to(
        "#p04-halo",
        { opacity: 0, scale: 1.4, duration: 0.4, ease: "power2.out" },
        2.12
      );

      // ── Scene 2 (2.1–4.2): fast cut to the sent bubble + thinking; caption reveals from 3.44 ──
      tl.to(
        "#p04-composer",
        { opacity: 0, y: -16, duration: 0.2, ease: "power2.in" },
        2.14
      );
      tl.fromTo(
        "#p04-run",
        { opacity: 0 },
        { opacity: 1, duration: 0.2, ease: "power1.out" },
        2.15

      tl.fromTo(
        "#p04-caption .p04-w",
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power3.out", stagger: 0.11 },
        3.44
      );

      // ── Scene 3 (4.18–8.3): answer crossfades in; cam pushes onto bubble + answer + bullets ──

      tl.set("#p04-patch", { opacity: 1 }, 4.16);
      tl.fromTo(
        "#p04-answer",
        { opacity: 0 },
        { opacity: 1, duration: 0.3, ease: "power1.out" },
        4.18
      );
      tl.fromTo(

        { x: 0, y: 0, scale: 1, transformOrigin: "0 0" },

          transformOrigin: "0 0",

          ease: "power3.inOut",
          force3D: false,
        },

      );
      tl.fromTo(
        "#p04-mark1",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power2.out" },
        6.26

      tl.fromTo(
