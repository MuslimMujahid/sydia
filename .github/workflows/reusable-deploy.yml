name: reusable-deploy

on:
  workflow_call:
    inputs:
      environment_name:
        required: true
        type: string
      image_tag:
        required: true
        type: string
      vite_api_url:
        required: true
        type: string
      frontend_cache_scope:
        required: true
        type: string
      backend_cache_scope:
        required: true
        type: string
    secrets:
      coolify_webhook:
        required: false
      coolify_token:
        required: false

jobs:
  publish:
    name: Publish ${{ inputs.environment_name }} images
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compute image namespace
        id: image_namespace
        shell: bash
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Validate Vite API URL
        shell: bash
        env:
          VITE_API_URL: ${{ inputs.vite_api_url }}
        run: |
          if [[ -z "${VITE_API_URL//[[:space:]]/}" ]]; then
            echo 'VITE API URL is required. Configure PROD_VITE_API_URL, DEV_VITE_API_URL, or shared VITE_API_URL for the caller.' >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: true
          build-args: |
            VITE_API_URL=${{ inputs.vite_api_url }}
          tags: |
            ghcr.io/${{ steps.image_namespace.outputs.value }}/sydia-frontend:${{ inputs.image_tag }}
            ghcr.io/${{ steps.image_namespace.outputs.value }}/sydia-frontend:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.frontend_cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.frontend_cache_scope }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ steps.image_namespace.outputs.value }}/sydia-backend:${{ inputs.image_tag }}
            ghcr.io/${{ steps.image_namespace.outputs.value }}/sydia-backend:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.backend_cache_scope }}
          cache-to: type=gha,mode=max,scope=${{ inputs.backend_cache_scope }}

  deploy:
    name: Trigger Coolify deploy
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read

    steps:
      - name: Trigger Coolify webhook
        env:
          COOLIFY_WEBHOOK: ${{ secrets.coolify_webhook }}
          COOLIFY_TOKEN: ${{ secrets.coolify_token }}
        shell: bash
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo 'Skipping Coolify deployment: both coolify_webhook and coolify_token are required.'
            exit 0
          fi

          curl --fail --show-error --silent \
            --request GET \
            --header "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_WEBHOOK"
