name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify workspace and production images
    runs-on: ubuntu-latest
    env:
      # Prisma CLI validation only needs a syntactically complete URL; no
      # database connection is opened by `prisma validate` or schema diff.
      BACKEND_DB_URL: postgresql://postgres:ci-placeholder@localhost:5432/sydia_ci
      BACKEND_AUTH_SECRET: ci-only-secret-that-is-at-least-32-characters
      BACKEND_AUTH_URL: http://localhost:5000
      BACKEND_PORT: "5000"
      FRONTEND_PORT: "3000"
      VITE_API_URL: http://localhost:5000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run check-types

      - name: Test
        run: bun run test

      - name: Build workspace
        run: bun run build

      - name: Validate Prisma schema and migration inputs
        working-directory: apps/backend
        run: |
          bunx prisma validate --schema prisma/schema.prisma
          bunx prisma migrate diff \
            --from-empty \
            --to-schema-datamodel prisma/schema.prisma \
            --script > /tmp/sydia-schema.sql
          test -s /tmp/sydia-schema.sql
          test -s prisma/migrations/migration_lock.toml
          test -n "$(find prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql -print -quit)"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend production image
        run: docker build --file apps/backend/Dockerfile --tag sydia-backend:ci .

      - name: Build frontend production image
        run: docker build \
          --file apps/frontend/Dockerfile \
          --build-arg VITE_API_URL="$VITE_API_URL" \
          --tag sydia-frontend:ci \
          .

  browser-e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sydia_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sydia_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BACKEND_DB_URL: postgresql://postgres:postgres@127.0.0.1:5432/sydia_e2e
      BACKEND_AUTH_SECRET: ci-e2e-secret-that-is-at-least-32-characters
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
      PLAYWRIGHT_BACKEND_URL: http://127.0.0.1:5000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply database migrations
        run: bun --cwd apps/backend run db:migrate:deploy
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Run browser tests
        run: bun --cwd apps/frontend run test:e2e
