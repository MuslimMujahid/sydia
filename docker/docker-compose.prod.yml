# Production images for the apps only. The database is intentionally not
# part of this stack — point BACKEND_DB_URL at an external database.
# Run from the repository root so build contexts resolve to the repository:
#   docker compose --project-directory . --env-file .env -f docker/docker-compose.prod.yml up -d --build

name: sydia

services:
  worker:
    image: monorepo-backend:prod
    env_file: .env
    environment:
      BACKEND_REDIS_URL: redis://redis:6379
    command: ["node", "dist/src/worker.js"]
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: monorepo-frontend:prod
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    env_file: .env
    environment:
      HOSTNAME: 0.0.0.0
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    restart: unless-stopped
