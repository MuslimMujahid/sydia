# Production images for the apps only. The database is intentionally not
# part of this stack — point BACKEND_DB_URL at an external database.
# Run from the repository root so build contexts resolve to the repository:
#   docker compose --project-directory . --env-file .env -f docker/docker-compose.prod.yml up -d --build

name: sydia

services:
  migration:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: migration
    env_file: .env
    command: ["node", "../../node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
  backend:
    image: monorepo-backend:prod
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    env_file: .env
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    restart: unless-stopped
    depends_on:
      migration:
        condition: service_completed_successfully

  worker:
    image: monorepo-backend:prod
    env_file: .env
    command: ["node", "dist/src/worker.js"]
    depends_on:
      migration:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: monorepo-frontend:prod
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    env_file: .env
    environment:
      HOSTNAME: 0.0.0.0
    ports:
      - "${FRONTEND_PORT}:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
