# Synthetic-only usage accounting. Compile/copy the relay before starting.
services:
  optimization-relay:
    image: node:22.23.2-alpine@sha256:b6f26b36c8ff49624cfdac716b8ea1138d606df02586a77d364bb5536a634f85
    command: [node, /relay.js]
    environment:
      HINDSIGHT_API_LLM_API_KEY: ${HINDSIGHT_API_LLM_API_KEY:?Existing extraction credential required}
      OPTIMIZATION_RELAY_CONTAINER: "true"
      OPTIMIZATION_RELAY_DOCKER_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:8901:8901"
    networks: [optimization-relay]
networks:
  optimization-relay:
    name: sydia-opt-usage-network
