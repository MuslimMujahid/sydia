groups:
  - name: sydia-google-calendar-sync
    interval: 1m
    rules:
      - alert: SydiaCalendarSyncOutboxBehind
        expr: |
          (max(sydia_calendar_sync_operation_oldest_age) > 300000
          or max(sydia_calendar_sync_operation_oldest_age_milliseconds) > 300000)
          and max(sydia_calendar_sync_operations_pending) > 0
        for: 10m
        labels:
          severity: warning
          component: google-calendar-sync
        annotations:
          summary: Google Calendar outbound changes are waiting too long
          description: The oldest pending Sydia calendar operation is older than five minutes.
          runbook: docs/runbooks/GOOGLE_CALENDAR_SYNC.md#quota-exhaustion-or-provider-throttling

      - alert: SydiaCalendarSyncPullStale
        expr: |
          max(sydia_calendar_sync_bindings_active) > 0
          and (max(sydia_calendar_sync_pull_oldest_age) > 3600000
          or max(sydia_calendar_sync_pull_oldest_age_milliseconds) > 3600000)
        for: 10m
        labels:
          severity: warning
          component: google-calendar-sync
        annotations:
          summary: An active Google Calendar binding has stale data
          description: The stalest successful pull for an active binding is older than one hour.
          runbook: docs/runbooks/GOOGLE_CALENDAR_SYNC.md#redis-outage

      - alert: SydiaCalendarSyncInitialImportStalled
        expr: |
          max(sydia_calendar_sync_bindings_never_synced) > 0
          and (max(sydia_calendar_sync_bindings_never_synced_oldest_age) > 3600000
          or max(sydia_calendar_sync_bindings_never_synced_oldest_age_milliseconds) > 3600000)
        for: 10m
        labels:
          severity: warning
          component: google-calendar-sync
        annotations:
          summary: A Google Calendar initial import has not completed
          description: At least one active binding has never completed a pull and is older than the provisional one-hour threshold. Calibrate this threshold against staging import profiles before paging on it.
          runbook: docs/runbooks/GOOGLE_CALENDAR_SYNC.md#failed-or-stalled-import

      - alert: SydiaCalendarSyncWatchCleanupStuck
        expr: |
          max(sydia_calendar_sync_watch_cleanup_pending) > 0
          and (max(sydia_calendar_sync_watch_cleanup_oldest_age) > 86400000
          or max(sydia_calendar_sync_watch_cleanup_oldest_age_milliseconds) > 86400000)
        for: 10m
        labels:
          severity: warning
          component: google-calendar-sync
        annotations:
          summary: A Google Calendar watch channel has not been cleaned up
          description: A channel has remained in pending cleanup for more than 24 hours.
          runbook: docs/runbooks/GOOGLE_CALENDAR_SYNC.md#watch-renewal-failure

      - alert: SydiaCalendarSyncMetricsSnapshotFailing
        expr: increase(sydia_calendar_sync_operational_snapshot_failures_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
          component: google-calendar-sync
        annotations:
          summary: Calendar sync operational metrics cannot read their database snapshot
          description: The calendar sync metrics callback has failed during the last ten minutes; database-backed gauges may be missing.
          runbook: docs/runbooks/GOOGLE_CALENDAR_SYNC.md#metrics-export

      - alert: SydiaCalendarSyncRetryBudgetExhausted
        expr: increase(sydia_calendar_sync_retry_exhausted_total[10m]) > 0
        for: 5m
        labels:
          severity: warning
          component: google-calendar-sync
        annotations:
          summary: Google Calendar operations exhausted automatic retries
          description: At least one calendar operation exhausted its automatic retry budget in the last ten minutes and may need a user retry or reconnect.
          runbook: docs/runbooks/GOOGLE_CALENDAR_SYNC.md#quota-exhaustion-or-provider-throttling

      - alert: SydiaCalendarTokenRevocationFailing
        expr: increase(sydia_calendar_sync_token_revocation_failures_total[15m]) > 0
        for: 5m
        labels:
          severity: warning
          component: google-calendar-sync
        annotations:
          summary: Google Calendar authorization revocation failed
          description: A user disconnect or concurrent OAuth cleanup could not revoke its Google authorization. Sync remains fenced; check the user's pending disconnect and retry it after resolving provider issues.
          runbook: docs/runbooks/GOOGLE_CALENDAR_SYNC.md#token-rejection-or-revoked-google-consent

      - alert: SydiaCalendarRetentionCleanupFailing
        expr: sum(increase(sydia_calendar_sync_jobs_total{kind="retention",outcome="failed"}[15m])) > 0
        for: 10m
        labels:
          severity: warning
          component: google-calendar-sync
        annotations:
          summary: Calendar retention cleanup is failing
          description: Calendar retention cleanup has failed recently; expired records remain in PostgreSQL. Check database errors and recovery workers without deleting unfinished operations.
          runbook: docs/runbooks/GOOGLE_CALENDAR_SYNC.md#retention-cleanup
